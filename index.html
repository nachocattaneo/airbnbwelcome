<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Guía de bienvenida para tu estadía en Buenos Aires.">
    <title>Casa Arévalo · Guest guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
      .agenda-panel.no-frame {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: flex-start !important;
        width: 100% !important;
        max-width: 100% !important;
        overflow: visible !important;
      }

      .agenda-embed {
        width: min(596px, 100%) !important;
        max-width: 100% !important;
        min-width: 0 !important;
        box-sizing: border-box !important;
        margin: 0 !important;
        overflow: hidden !important;
      }

      .agenda-embed .instagram-media {
        width: 100% !important;
        max-width: 540px !important;
        min-width: 0 !important;
        box-sizing: border-box !important;
        margin-left: auto !important;
        margin-right: auto !important;
      }

      @media (max-width: 650px) {
        .agenda-panel.no-frame {
          width: 100% !important;
          max-width: 100% !important;
          padding: 0 !important;
        }

        .agenda-embed {
          width: 100% !important;
          max-width: 100% !important;
          padding: 20px 12px 22px !important;
        }

        .agenda-embed .instagram-media {
          width: 100% !important;
          max-width: 100% !important;
          min-width: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="hero" id="top">
      <nav class="nav shell" aria-label="Navegación principal">
        <a class="brand" href="#top" aria-label="Casa Arévalo">CASA <span>Arévalo</span></a>
        <div class="nav-actions">
          <a class="nav-link" href="#agenda" data-es="Agenda" data-en="What's on"></a>
          <button class="language-toggle" id="lang" type="button" aria-label="Change language"></button>
        </div>
      </nav>
      <div class="hero-content shell">
        <p class="guest-welcome" id="guest-welcome" data-es="BIENVENIDA, MARIA EMILIA!" data-en="WELCOME, MARIA EMILIA!"></p>
        <h1 data-es="Tu refugio<br>en la ciudad." data-en="Your haven<br>in the city."></h1>
        <p class="hero-lead" data-es="Todo lo que necesitás para disfrutar una estadía tranquila, cómoda y muy porteña." data-en="Everything you need for a peaceful, comfortable and truly Buenos Aires stay."></p>
        <a class="hero-cta" href="#stay" data-es="Descubrí la guía <span aria-hidden='true'>↓</span>" data-en="Explore the guide <span aria-hidden='true'>↓</span>"></a>
      </div>

    </header>

    <main>
      <section class="welcome shell" id="stay">
        <div class="section-heading">
          <p class="eyebrow" data-es="DURANTE TU ESTADÍA" data-en="DURING YOUR STAY"></p>
          <h2 data-es="Un respiro, sin salir de casa." data-en="A little escape, without leaving home."></h2>
        </div>
        <p class="section-intro" data-es="El edificio cuenta con espacios pensados para que puedas bajar el ritmo o mantener tu rutina." data-en="The building has spaces designed for you to slow down or keep your routine."></p>
        <p class="stay-intro" data-es="Descubrí Palermo Hollywood desde este estudio luminoso y moderno, con balcón privado y vistas abiertas. Ubicado en uno de los barrios más vibrantes de Buenos Aires, rodeado de los mejores cafés, restaurantes, bares y locales de diseño. Disfrutá de un edificio premium con gran piscina, gimnasio totalmente equipado, solárium y área de parrilla. Ideal tanto para estadías de placer como de trabajo, con WiFi de alta velocidad, aire acondicionado, lavarropas, cocina totalmente equipada y un cómodo espacio de trabajo." data-en="Discover Palermo Hollywood from this bright, modern studio with a private balcony and open views. Located in one of Buenos Aires' most vibrant neighborhoods, surrounded by top cafés, restaurants, bars, and boutique shops. Enjoy a premium building with a large swimming pool, fully equipped gym, solarium, and BBQ area. Perfect for both leisure and business stays, with high-speed Wi-Fi, air conditioning, a washer, a fully equipped kitchen, and a comfortable workspace."></p>
        <div class="amenities">
          <article class="amenity-card gym-card">
            <img class="amenity-photo" src="assets/gimnasio.jpg" alt="Gimnasio del edificio">
            <div class="amenity-body">
              <span class="card-number">01</span>
              <h3 data-es="Gimnasio" data-en="Gym"></h3>
              <p data-es="Piso 9. Usá tu llavero digital para entrar." data-en="9th floor. Use your digital key fob to enter."></p>
              <span class="card-detail" data-es="PISO 9" data-en="9TH FLOOR"></span>
            </div>
          </article>
          <article class="amenity-card pool-card">
            <img class="amenity-photo" src="assets/piscina.jpg" alt="Piscina del edificio">
            <div class="amenity-body">
              <span class="card-number">02</span>
              <h3 class="asterisk-title" data-es="Piscina" data-en="Pool"></h3>
              <p data-es="Tomá el ascensor y presioná “EP”. Al salir, atravesá las dos puertas blancas usando tu llavero digital." data-en="Take the elevator and press “EP”. After exiting, go through the two white doors using your digital key fob."></p>
              <span class="card-disclaimer" data-es="*Disponible entre Noviembre 15 y Marzo 31" data-en="*Available from Nov 15 to March 31"></span>
              <span class="card-detail" data-es="ASCENSOR · EP" data-en="ELEVATOR · EP"></span>
            </div>
          </article>
          <article class="amenity-card solarium-card">
            <img class="amenity-photo" src="assets/solarium.jpg" alt="Solárium del edificio">
            <div class="amenity-body">
              <span class="card-number">03</span>
              <h3 data-es="Solárium" data-en="Solarium"></h3>
              <p data-es="Está en el piso 9, junto al gimnasio." data-en="It is on the 9th floor, next to the gym."></p>
              <span class="card-detail" data-es="PISO 9 · JUNTO AL GIMNASIO" data-en="9TH FLOOR · NEXT TO THE GYM"></span>
            </div>
          </article>
        </div>
      </section>

      <section class="neighborhood" id="restaurants">
        <div class="shell neighborhood-grid">
          <div class="neighborhood-copy">
            <p class="eyebrow" data-es="A UNAS CUADRAS" data-en="JUST A FEW BLOCKS AWAY"></p>
            <h2 data-es="Sabores para<br>guardar." data-en="Flavours worth<br>remembering."></h2>
            <p data-es="Restaurantes, cafés y mesas especiales elegidas para vos. Esta selección se irá actualizando con nuestros favoritos." data-en="Restaurants, cafés and special tables selected for you. This collection will be updated with our favourite spots."></p>
          </div>
          <div class="restaurant-list" id="restaurant-list" aria-live="polite"></div>
        </div>
      </section>

      <section class="agenda shell" id="agenda">
        <div class="agenda-heading">
          <p class="eyebrow" data-es="ESTA SEMANA EN BUENOS AIRES" data-en="THIS WEEK IN BUENOS AIRES"></p>
          <h2 data-es="La ciudad está pasando ahora." data-en="The city is happening right now."></h2>
        </div>
        <div class="agenda-panel" id="activities-panel" aria-live="polite"></div>
        <p class="agenda-note" data-es="La agenda se actualiza semanalmente con una selección especial para nuestros huéspedes." data-en="The agenda is updated weekly with a special selection for our guests."></p>
      </section>

      <section class="closing">
        <div class="shell closing-inner">
          <p class="eyebrow" data-es="BUEN VIAJE" data-en="ENJOY YOUR STAY"></p>
          <h2 data-es="Que Buenos Aires<br>te sorprenda." data-en="May Buenos Aires<br>surprise you."></h2>
          <a href="#top" class="back-top" data-es="Volver arriba ↑" data-en="Back to top ↑"></a>
        </div>
      </section>
    </main>

    <footer class="footer shell">
      <span>CASA Arévalo</span>
      <span>PALERMO</span>
    </footer>
    <script src="content.js"></script>
    <script src="script.js"></script>
    <script async src="//www.instagram.com/embed.js"></script>
  </body>
</html>
